name: Claude CI Auto-Fix

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Claude to auto-fix CI failures
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash,Read,Edit,Write"
          direct_prompt: |
            The "PR Checks" CI workflow just failed on branch ${{ github.event.workflow_run.head_branch }}.

            Diagnose and fix every failure by running the checks in this exact order:

            1. Run: pnpm format:check
               If it fails -> run: pnpm format (auto-fixes all Prettier issues)

            2. Run: pnpm tsc
               If it fails -> fix every TypeScript error.
               Rules: no any types ever, all types must be explicit.

            3. Run: pnpm build
               If it fails -> fix the build error.

            4. Run: pnpm check
               Must exit 0 before proceeding.

            5. After ALL checks pass, commit and push:
               git config user.name "Claude CI Bot"
               git config user.email "claude-bot@nasna.app"
               git add -A
               git commit -m "fix: auto-fix CI failures [skip ci auto-fix]"
               git push origin HEAD:${{ github.event.workflow_run.head_branch }}

            Nasna CLAUDE.md rules you must never violate:
            - Always run pnpm format before committing (not format:check)
            - No any in TypeScript - use unknown and narrow, or define a proper type
            - All new UI strings must be in all three locales: src/locales/ar/, src/locales/en/, src/locales/fr/
            - Never log PII (names, phones, locations) - log document IDs only
            - Never use getDocs() without limit() on any list
            - All Firestore writes must go through Zod validation first
