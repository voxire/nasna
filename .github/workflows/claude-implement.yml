name: Claude Implement Feature

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Feature description for Claude Code to implement"
        required: true
        type: string
      branch_name:
        description: "Branch name (e.g. feat/my-feature)"
        required: true
        type: string

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Setup git identity
        run: |
          git config user.name "Claude Code Bot"
          git config user.email "claude-bot@nasna.app"

      - name: Create feature branch
        run: git checkout -b ${{ inputs.branch_name }}

      - name: Write prompt to file
        env:
          PROMPT: ${{ inputs.prompt }}
          BRANCH: ${{ inputs.branch_name }}
        run: |
          cat > /tmp/claude-prompt.txt << 'ENDMARKER'
          You are implementing a feature for Nasna, a humanitarian aid coordination platform.
          Read CLAUDE.md first - all rules there are non-negotiable.
          ENDMARKER
          echo "" >> /tmp/claude-prompt.txt
          echo "## Feature to implement" >> /tmp/claude-prompt.txt
          echo "$PROMPT" >> /tmp/claude-prompt.txt
          cat >> /tmp/claude-prompt.txt << 'ENDMARKER'

          ## Steps you MUST follow after implementing
          1. Run: pnpm format
             Auto-fixes all Prettier issues. Never use format:check.
          2. Run: pnpm tsc
             Fix ALL TypeScript errors. No any types ever.
          3. Run: pnpm build
             Fix any build errors before proceeding.
          4. Commit: git add -A && git commit -m "feat: implement feature"
          5. Push: git push origin HEAD
          6. Open PR: gh pr create --title "feat: implement feature" --body "$(cat /tmp/claude-prompt.txt)" --base main

          ## Non-negotiable Nasna rules
          - pnpm format must run before every commit
          - No any types in TypeScript
          - All UI strings in src/locales/ar/, en/, fr/
          - Never log PII
          - Never getDocs() without limit()
          - All Firestore writes through Zod
          ENDMARKER

      - name: Implement feature with Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: claude --dangerously-skip-permissions -p "$(cat /tmp/claude-prompt.txt)"
