name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck and functions build
        run: pnpm check

      - name: Build app
        run: pnpm build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: App tests with coverage
        run: pnpm test:app:coverage

      - name: Functions tests with coverage
        run: pnpm test:functions:coverage

      - name: Coverage summary
        if: always()
        run: |
          node <<'EOF'
          const fs = require('fs');
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const exists = (path) => fs.existsSync(path);
          const readSummary = (path) => (exists(path) ? JSON.parse(fs.readFileSync(path, 'utf8')).total : null);
          const app = readSummary('coverage/app/coverage-summary.json');
          const functions = readSummary('coverage/functions/coverage-summary.json');
          const row = (name, metric) =>
            metric
              ? `| ${name} | ${metric.lines.pct}% | ${metric.statements.pct}% | ${metric.functions.pct}% | ${metric.branches.pct}% |`
              : `| ${name} | n/a | n/a | n/a | n/a |`;
          fs.appendFileSync(
            summaryPath,
            [
              '## Coverage Summary',
              '',
              '| Project | Lines | Statements | Functions | Branches |',
              '| --- | ---: | ---: | ---: | ---: |',
              row('App', app),
              row('Functions', functions),
              '',
            ].join('\n'),
          );
          EOF

      - name: Comment PR result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-checks-status -->';
            const readSummary = (path) => {
              if (!fs.existsSync(path)) return null;
              return JSON.parse(fs.readFileSync(path, 'utf8')).total;
            };

            const app = readSummary('coverage/app/coverage-summary.json');
            const functions = readSummary('coverage/functions/coverage-summary.json');
            const icon = process.env.JOB_STATUS === 'success' ? '✅' : '❌';
            const title =
              process.env.JOB_STATUS === 'success'
                ? 'PR checks passed'
                : 'PR checks failed';

            const coverageTable = [
              '| Project | Lines | Statements | Functions | Branches |',
              '| --- | ---: | ---: | ---: | ---: |',
              `| App | ${app ? `${app.lines.pct}%` : 'n/a'} | ${app ? `${app.statements.pct}%` : 'n/a'} | ${app ? `${app.functions.pct}%` : 'n/a'} | ${app ? `${app.branches.pct}%` : 'n/a'} |`,
              `| Functions | ${functions ? `${functions.lines.pct}%` : 'n/a'} | ${functions ? `${functions.statements.pct}%` : 'n/a'} | ${functions ? `${functions.functions.pct}%` : 'n/a'} | ${functions ? `${functions.branches.pct}%` : 'n/a'} |`,
            ].join('\n');

            const body = [
              marker,
              `${icon} **${title}**`,
              '',
              `Workflow: [${context.workflow} #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '### Coverage',
              coverageTable,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
